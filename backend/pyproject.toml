[project]
name = "mizan"
version = "0.1.0"
description = "Compliance analyst assistant over policy documents and data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan"]
